[build-system]
requires = ["setuptools>=80.9"]
build-backend = "setuptools.build_meta"

[project]
name = "bilingual-subtitle-pipeline"
version = "0.4.0"
description = "Local and remote bilingual subtitle recognition, correction, and translation pipeline."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "faster-whisper==1.2.1",
  "ffsubsync==0.5.1",
  "fonttools==4.60.1",
  "imageio-ffmpeg==0.6.0",
  "opencc-python-reimplemented==0.1.7",
  "paramiko==5.0.0",
  "pillow==12.0.0",
  "psutil==7.0.0",
  "tqdm==4.67.1",
]

[project.optional-dependencies]
ocr = [
  "paddleocr==3.7.0",
  "requests==2.32.5",
]
dev = [
  "ruff==0.12.0",
]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
  "ass_styles",
  "audio_to_subtitle",
  "font_delivery",
  "frontend_settings",
  "llm_policy",
  "output_paths",
  "pipeline_policy",
  "scene_timing",
  "ssh_tunnel",
  "subtitle_delivery",
  "subtitle_frontend",
  "subtitle_pipeline",
  "subtitle_quality",
  "subtitle_sync",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
